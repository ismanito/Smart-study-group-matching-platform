services:
  - type: web
    name: studymatch
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
